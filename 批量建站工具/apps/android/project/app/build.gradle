apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "com.sitefoundry.workbench"
    compileSdk = rootProject.ext.compileSdkVersion
    // Native platform information reads the installed version through BuildConfig.
    // Modern AGP disables generation unless the application explicitly requests it.
    buildFeatures { buildConfig = true }
    defaultConfig {
        applicationId "com.sitefoundry.workbench"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Keep updates monotonic even when the public version is renamed.
        versionCode 10608
        versionName "1.1.3"
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // The launcher lives in installed nativeLibraryDir so Android's executable
    // policy permits Node child processes. Data and dependencies stay in filesDir.
    ndkVersion '28.2.13676358'
    // Build scripts compile the launcher ahead of Gradle and stage it together
    // with libnode in jniLibs. AGP does not package add_executable targets itself.
    sourceSets { main { jniLibs.srcDirs = ['../../native-runtime/jniLibs'] } }
    packaging { jniLibs { useLegacyPackaging = true } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }
    kotlinOptions { jvmTarget = '21' }
    signingConfigs {
        // Signing secrets are private machine data; never commit a key/password.
        release {
            if (System.getenv('SITEFOUNDRY_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('SITEFOUNDRY_ANDROID_KEYSTORE'))
                storePassword System.getenv('SITEFOUNDRY_ANDROID_KEY_PASSWORD')
                keyAlias 'sitefoundry'
                keyPassword System.getenv('SITEFOUNDRY_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('SITEFOUNDRY_ANDROID_KEYSTORE')) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // The app inspects origin-scoped bridge support directly; Capacitor's own
    // implementation dependency is deliberately not part of our compile API.
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
